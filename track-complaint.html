<!-- track-complaint.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Complaint - JalNetra</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --hero-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-btn: 9999px;
      --radius-card: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 40px; }

    header { background-color: #0f172a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .logo { color: #ffffff; font-size: 1.25rem; font-weight: 700; text-decoration: none; }
    .logo span { color: var(--primary); }
    nav { display: flex; gap: 15px; align-items: center; }
    nav a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; font-weight: 500; }

    .hero { background: var(--hero-bg); color: #ffffff; text-align: center; padding: 3rem 1.5rem; }
    .hero h1 { font-size: 2rem; font-weight: 800; }

    .search-box-wrapper { max-width: 500px; margin: 1.5rem auto 0; display: flex; background: #ffffff; border-radius: var(--radius-btn); padding: 4px 6px 4px 18px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    .search-input { flex: 1; border: none; outline: none; font-size: 0.95rem; color: var(--text-main); background: transparent; }
    .btn-search { background-color: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: var(--radius-btn); font-weight: 600; cursor: pointer; }

    .container { max-width: 700px; margin: 30px auto; padding: 0 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-card); padding: 25px; margin-bottom: 20px; }

    .timeline-item { border-left: 3px solid var(--primary); padding-left: 12px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Home</a>
  </header>

  <section class="hero">
    <h1>Track Complaint Progress</h1>
    <div class="search-box-wrapper">
      <input type="text" id="refInput" class="search-input" placeholder="Enter reference number (e.g. JN-2026-102938)...">
      <button id="trackBtn" class="btn-search">Track</button>
    </div>
  </section>

  <div class="container">
    <div class="card" id="statusCard" style="display: none;">
      <h3 style="font-size: 1.1rem; color: var(--primary); margin-bottom: 12px;">Reference: <span id="dispRef"></span></h3>
      <p style="font-size: 0.9rem; margin-bottom: 6px;"><strong>Category:</strong> <span id="dispCat"></span></p>
      <p style="font-size: 0.9rem; margin-bottom: 20px;"><strong>Current Status:</strong> <span id="dispStatus" style="color: var(--primary); font-weight: 700;"></span></p>

      <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">Status Timeline</h4>
      <div id="timelineContainer"></div>
    </div>
  </div>

  <script type="module">
    import { db, collection, getDocs, query, where } from './firebase.js';

    document.getElementById('trackBtn').addEventListener('click', async () => {
      const refNumber = document.getElementById('refInput').value.trim();
      if (!refNumber) return;

      const q = query(collection(db, "complaints"), where("reference_number", "==", refNumber));
      const snap = await getDocs(q);

      if (snap.empty) {
        alert("No record found for this reference number.");
        return;
      }

      const docSnap = snap.docs[0];
      const data = docSnap.data();

      document.getElementById('dispRef').innerText = data.reference_number;
      document.getElementById('dispCat').innerText = data.category;
      document.getElementById('dispStatus').innerText = data.status;

      const historySnap = await getDocs(collection(db, "complaints", docSnap.id, "history"));
      const container = document.getElementById('timelineContainer');
      container.innerHTML = "";

      historySnap.forEach(h => {
        const hd = h.data();
        container.innerHTML += `
          <div class="timeline-item">
            <strong style="font-size: 0.9rem;">Status: ${hd.new_status}</strong>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">${hd.note}</p>
          </div>
        `;
      });

      document.getElementById('statusCard').style.display = 'block';
    });
  </script>
</body>
</html>
