<!-- find-authority.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Water Authority - JalNetra</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --hero-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-btn: 9999px;
      --radius-card: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 40px; }

    header { background-color: #0f172a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .logo { color: #ffffff; font-size: 1.25rem; font-weight: 700; text-decoration: none; }
    .logo span { color: var(--primary); }
    nav { display: flex; gap: 15px; align-items: center; }
    nav a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .nav-btn { background-color: var(--primary); color: #ffffff !important; padding: 8px 18px; border-radius: var(--radius-btn); font-weight: 600; }

    .hero { background: var(--hero-bg); color: #ffffff; text-align: center; padding: 3.5rem 1.5rem; }
    .hero h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }

    /* Search Bar Input Container */
    .search-box-wrapper { max-width: 550px; margin: 1.5rem auto 0; display: flex; background: #ffffff; border-radius: var(--radius-btn); padding: 4px 6px 4px 18px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    .search-input { flex: 1; border: none; outline: none; font-size: 0.95rem; color: var(--text-main); background: transparent; }
    .btn-search { background-color: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: var(--radius-btn); font-weight: 600; cursor: pointer; }
    .btn-search:hover { background-color: var(--primary-hover); }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-card); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .card-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .btn-card { display: block; text-align: center; background-color: #f1f5f9; color: var(--primary); padding: 8px 0; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; }
    .btn-card:hover { background-color: #e0e7ff; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Home</a>
  </header>

  <section class="hero">
    <h1>Find Authority</h1>
    <p style="color: #94a3b8; font-size: 0.95rem;">Search by city or authority name to access local water services.</p>
    <div class="search-box-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by city (e.g., New Delhi, Bengaluru)...">
      <button id="searchBtn" class="btn-search">Search</button>
    </div>
  </section>

  <div class="container">
    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 15px;">Registered Water Authorities</h2>
    <div class="grid" id="authoritiesGrid">
      <p style="color: var(--text-muted);">Loading authorities...</p>
    </div>
  </div>

  <script type="module">
    import { db, collection, getDocs } from './firebase.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('authoritiesGrid');
      const searchInput = document.getElementById('searchInput');
      let allAuthorities = [];

      try {
        const snap = await getDocs(collection(db, "authorities"));
        grid.innerHTML = "";
        
        snap.forEach(docSnap => {
          allAuthorities.push({ id: docSnap.id, ...docSnap.data() });
        });

        renderList(allAuthorities);
      } catch (err) {
        grid.innerHTML = `<p style="color: red;">Failed to load authorities: ${err.message}</p>`;
      }

      function renderList(list) {
        grid.innerHTML = "";
        if (list.length === 0) {
          grid.innerHTML = "<p style='color: var(--text-muted);'>No matching water authorities found.</p>";
          return;
        }

        list.forEach(a => {
          grid.innerHTML += `
            <div class="card">
              <div>
                <div class="card-title">${a.name}</div>
                <div class="card-meta"><strong>Location:</strong> ${a.city}, ${a.state}</div>
                <div class="card-meta"><strong>Contact:</strong> ${a.email} | ${a.phone}</div>
              </div>
              <a href="authority.html?id=${a.id}" class="btn-card">View Public Profile</a>
            </div>
          `;
        });
      }

      document.getElementById('searchBtn').addEventListener('click', () => {
        const query = searchInput.value.toLowerCase().trim();
        const filtered = allAuthorities.filter(a => a.city.toLowerCase().includes(query) || a.name.toLowerCase().includes(query));
        renderList(filtered);
      });
    });
  </script>
</body>
</html>
